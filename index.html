<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contagem Regressiva</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;

            background: black;
            color: white;

            font-family: Arial, sans-serif;
            text-align: center;
        }

        #countdown {
            font-size: clamp(2rem, 8vw, 5em);
            font-weight: bold;
        }

        #date {
            font-size: clamp(1.5rem, 5vw, 3em);
            margin-top: 10px;
        }

        #mic {
            width: 80vw;
            height: 65vh;
            object-fit: contain;
            margin-top: 20px;
        }

        #startButton {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
            background: white;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>

<body>

    <div id="countdown">00d 00:00:00</div>

    <div id="date">22.11.26</div>

    <img id="mic" src="mic.png" alt="Microfone">

    <button id="startButton">Iniciar áudio</button>

    <audio id="sound" src="proj1.mp3" preload="auto"></audio>

    <script>
        const targetDate = new Date("2026-11-22T19:00:00").getTime();

        const countdownElement = document.getElementById("countdown");
        const sound = document.getElementById("sound");
        const startButton = document.getElementById("startButton");

        function updateCountdown() {
            const now = Date.now();
            const remainingTime = targetDate - now;

            if (remainingTime <= 0) {
                countdownElement.textContent = "00d 00:00:00";
                clearInterval(countdownInterval);
                return;
            }

            const days = Math.floor(
                remainingTime / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (remainingTime / (1000 * 60 * 60)) % 24
            );

            const minutes = Math.floor(
                (remainingTime / (1000 * 60)) % 60
            );

            const seconds = Math.floor(
                (remainingTime / 1000) % 60
            );

            countdownElement.textContent =
                `${String(days).padStart(2, "0")}d ` +
                `${String(hours).padStart(2, "0")}:` +
                `${String(minutes).padStart(2, "0")}:` +
                `${String(seconds).padStart(2, "0")}`;
        }

        updateCountdown();

        const countdownInterval = setInterval(updateCountdown, 1000);

        sound.loop = false;

        sound.play().catch(() => {
            startButton.style.display = "block";
        });

        startButton.addEventListener("click", () => {
            sound.play();
            startButton.style.display = "none";
        });
    </script>

</body>
</html>
