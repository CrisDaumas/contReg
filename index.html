```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contagem Regressiva</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;

            background-color: #000000;
            color: #ffffff;

            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
        }

        #countdown {
            font-size: clamp(2rem, 8vw, 5em);
            font-weight: bold;
        }

        #date {
            font-size: clamp(1.5rem, 5vw, 3em);
            margin-top: 10px;
        }

        #mic {
            display: block;

            width: 80vw;
            height: 65vh;

            object-fit: contain;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div id="countdown">00d 00:00:00</div>

    <div id="date">22.11.26</div>

    <img id="mic" src="mic.png" alt="Microfone">

    <audio id="sound" src="proj1.mp3" preload="auto"></audio>

    <script>
        const targetDate = new Date("2026-11-22T19:00:00").getTime();

        const countdownElement = document.getElementById("countdown");
        const sound = document.getElementById("sound");

        function updateCountdown() {
            const now = new Date().getTime();
            const remainingTime = targetDate - now;

            if (remainingTime <= 0) {
                countdownElement.textContent = "00d 00:00:00";
                clearInterval(countdownInterval);
                return;
            }

            const days = Math.floor(
                remainingTime / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (remainingTime / (1000 * 60 * 60)) % 24
            );

            const minutes = Math.floor(
                (remainingTime / (1000 * 60)) % 60
            );

            const seconds = Math.floor(
                (remainingTime / 1000) % 60
            );

            countdownElement.textContent =
                `${String(days).padStart(2, '0')}d ` +
                `${String(hours).padStart(2, '0')}:` +
                `${String(minutes).padStart(2, '0')}:` +
                `${String(seconds).padStart(2, '0')}`;
        }

        // Inicia a contagem imediatamente
        updateCountdown();

        const countdownInterval = setInterval(updateCountdown, 1000);

        // Toca o áudio imediatamente ao carregar a página
        sound.loop = false;
        sound.currentTime = 0;

        sound.play().catch(error => {
            console.log("O navegador bloqueou a reprodução automática:", error);
        });
    </script>

</body>
</html>
